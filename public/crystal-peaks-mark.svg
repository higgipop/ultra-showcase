<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Crystal Peaks mountain mark</title>
  <desc id="desc">Text-free hexagonal mountain logo in blue, cyan, and green.</desc>
  <defs>
    <linearGradient id="hexStroke" x1="12" y1="67" x2="83" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#24a9df"/>
      <stop offset="0.48" stop-color="#258dcc"/>
      <stop offset="1" stop-color="#28469a"/>
    </linearGradient>
    <linearGradient id="mountainFill" x1="50" y1="45" x2="50" y2="97" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#59b879"/>
      <stop offset="1" stop-color="#95c93d"/>
    </linearGradient>
  </defs>

  <!-- Open hexagonal frame -->
  <path d="M50 3.5 91 27v39.5M9 66.5V27L50 3.5"
        fill="none" stroke="url(#hexStroke)" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mountain field and lower peak -->
  <path d="M5 69.5 28.2 48.2l6.1 6.2L49.2 36.8l9.8 9.5 7.3-7.1L95 69.5
           89.3 76.8 50 98 10.7 76.8Z"
        fill="url(#mountainFill)"/>

  <!-- Cyan ridge line -->
  <path d="M6.5 69.5 28.2 48.2l6.1 6.2L49.2 36.8l9.8 9.5 7.3-7.1 27.2 30.3"
        fill="none" stroke="#32abd5" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="miter"/>

  <!-- White snow and mountain faces -->
  <path d="M9 70.6 28.2 52.7l5.9 5.9 15.2-17.8 9.6 9.4 7.2-7L91 70.8
           73.1 56.1 76.4 67 66.2 58.3 66.2 72.3 54.3 57.7 49.4 74.1
           44.4 58.1 34 68.7 36.1 58.9 28.1 64.8 28.8 56.9Z"
        fill="#ffffff"/>

  <!-- Green foreground ridge and clean lower silhouette -->
  <path d="M5 69.5 13 77 50 98 87 77 95 69.5 88.8 66.9 73.1 55.6
           76.3 67 66.2 58.4 66.2 72.5 54.3 57.7 49.4 74.2 44.4 58.2
           34 68.8 36 59 27.9 65 28.7 56.8 11.2 72.8Z"
        fill="url(#mountainFill)" fill-rule="evenodd"/>

</svg>
